server {
    listen 80;
    listen [::]:80;
    server_name wm.lslinux.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wm.lslinux.org;

    ssl_certificate /etc/letsencrypt/live/lslinux/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lslinux/privkey.pem;

    root /usr/share/roundcube;
    index index.php;

    client_max_body_size 25m;

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /robots.txt { allow all; log_not_found off; access_log off; }

    location ~ ^/(bin|SQL|config|temp|logs|vendor|installer)/ { deny all; }
    location ~ /\. { deny all; }

    location ~ ^/(skins|plugins|program)/ {
        expires 1d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
}
