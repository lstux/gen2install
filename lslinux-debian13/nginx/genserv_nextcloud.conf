# /etc/nginx/vhosts/nextcloud.conf sur GENSERV (Gentoo) : proxy transitoire vers lslng
# pour les clients dont le DNS de cloud.lslinux.org n'est pas encore a jour.
# A retirer quand genserv est decommissionne. Cote lslng : trusted_proxies = 178.32.216.3.

server {
    server_name cloud.lslinux.org cloud.ossn.info cloud.saintmarc.bzh;
    listen *:80;
    listen [::]:80;
    server_tokens off;

    access_log /var/log/nginx/nextcloud/access.log main;
    error_log /var/log/nginx/nextcloud/error.log info;

    include inc/certbot.conf;

    location / {
        return 301 https://cloud.lslinux.org$request_uri;
    }
}

server {
    server_name cloud.lslinux.org;
    include inc/ssl.conf;

    access_log /var/log/nginx/nextcloud/access.log main;
    error_log /var/log/nginx/nextcloud/error.log info;
    server_tokens off;

    client_max_body_size 512M;
    client_body_timeout 300s;

    location / {
        proxy_pass https://145.239.67.105;
        proxy_ssl_server_name on;
        proxy_ssl_name cloud.lslinux.org;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 5;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host cloud.lslinux.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
