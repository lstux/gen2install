# /etc/nginx/sites-available/lstux-sites (lien dans sites-enabled)
# <site>.lslinux.org servi depuis /var/www/lstux/<site> (sites deployes par publish-github).
# Certificat : /etc/letsencrypt/live/lslinux/ (SAN *.lslinux.org, un seul niveau de sous-domaine).
# Les server_name exacts (cloud, grafana, wm, www...) l'emportent sur cette regex ;
# un dossier absent donne un 404. Un seul label [a-z0-9-] : pas de point, pas de "..".

map $uri $lstux_cache {
    default                                   "";
    ~*(^/sw\.js$|^/manifest[^/]*$|\.html$|/$) "no-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name ~^(?<site>[a-z0-9-]+)\.lslinux\.org$;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ~^(?<site>[a-z0-9-]+)\.lslinux\.org$;

    ssl_certificate     /etc/letsencrypt/live/lslinux/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lslinux/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $lstux_cache;

    root /var/www/lstux/$site;
    index index.html;
    disable_symlinks on from=$document_root;

    access_log /var/log/nginx/lstux.access.log;
    error_log  /var/log/nginx/lstux.error.log;

    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
