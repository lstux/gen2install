# /etc/nginx/sites-available/catchall : ferme les requetes sans Host connu (IP, noms inconnus)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/lslinux/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lslinux/privkey.pem;

    return 444;
}
