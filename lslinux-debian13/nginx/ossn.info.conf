# /etc/nginx/sites-available/ossn.info
# Certificat : /etc/letsencrypt/live/lslinux/ (SAN couvre ossn.info et *.ossn.info)
# Orchestre Symphonique de Saint-Nazaire. Site repris de genserv (130_ossn.sh) :
# PHP minimal (includes + redirection mobile Mobile_Detect vers /m/), sans base ni formulaire.
# Hote canonique : www.ossn.info (comme sur genserv).

server {
    listen 80;
    listen [::]:80;
    server_name ossn.info www.ossn.info;

    location /.well-known/acme-challenge/ {
        root /var/www/ossn.info/htdocs;
    }

    location / {
        return 301 https://www.ossn.info$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ossn.info;

    ssl_certificate     /etc/letsencrypt/live/lslinux/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lslinux/privkey.pem;

    return 301 https://www.ossn.info$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.ossn.info;

    ssl_certificate     /etc/letsencrypt/live/lslinux/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lslinux/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;

    root /var/www/ossn.info/htdocs;   # /var/www/ossn.info = racine du chroot sftp (compte ossn)
    index index.html index.php;

    access_log /var/log/nginx/ossn.info.access.log;
    error_log  /var/log/nginx/ossn.info.error.log;

    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # PHP-FPM 8.4 (snippet Debian : try_files, PATH_INFO). Debian : display_errors=Off,
    # error_reporting sans E_DEPRECATED (Mobile_Detect 2.8.33 declare un parametre nullable implicite).
    location ~ [^/]\.php(/|$) {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
}
