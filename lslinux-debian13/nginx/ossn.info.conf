# /etc/nginx/sites-available/ossn.info
# Certificat : /etc/letsencrypt/live/lslinux/ (SAN couvre ossn.info et *.ossn.info)

server {
    listen 80;
    listen [::]:80;
    server_name ossn.info www.ossn.info;

    location /.well-known/acme-challenge/ {
        root /var/www/ossn.info;
    }

    location / {
        return 301 https://ossn.info$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.ossn.info;

    ssl_certificate     /etc/letsencrypt/live/lslinux/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lslinux/privkey.pem;

    return 301 https://ossn.info$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ossn.info;

    ssl_certificate     /etc/letsencrypt/live/lslinux/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lslinux/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=63072000" always;

    root /var/www/ossn.info;
    index index.html;

    access_log /var/log/nginx/ossn.info.access.log;
    error_log  /var/log/nginx/ossn.info.error.log;

    location / {
        try_files $uri $uri/ =404;
    }
}
