# /etc/nginx/sites-available/ruedesrancy.org
# Certificat : /etc/letsencrypt/live/lslinux/ (SAN couvre ruedesrancy.org et *.ruedesrancy.org)

server {
    listen 80;
    listen [::]:80;
    server_name ruedesrancy.org www.ruedesrancy.org;

    location /.well-known/acme-challenge/ {
        root /var/www/ruedesrancy.org;
    }

    location / {
        return 301 https://ruedesrancy.org$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.ruedesrancy.org;

    ssl_certificate     /etc/letsencrypt/live/lslinux/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lslinux/privkey.pem;

    return 301 https://ruedesrancy.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ruedesrancy.org;

    ssl_certificate     /etc/letsencrypt/live/lslinux/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lslinux/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=63072000" always;

    root /var/www/ruedesrancy.org;
    index index.html;

    access_log /var/log/nginx/ruedesrancy.org.access.log;
    error_log  /var/log/nginx/ruedesrancy.org.error.log;

    location / {
        try_files $uri $uri/ =404;
    }
}
