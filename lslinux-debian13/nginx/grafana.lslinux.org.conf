# /etc/nginx/sites-available/grafana.lslinux.org (lien dans sites-enabled)
# Certificat : /etc/letsencrypt/live/lslinux/ (SAN *.lslinux.org). Grafana ecoute sur 127.0.0.1:3000.

server {
    listen 80;
    listen [::]:80;
    server_name grafana.lslinux.org;

    location / {
        return 301 https://grafana.lslinux.org$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name grafana.lslinux.org;

    ssl_certificate     /etc/letsencrypt/live/lslinux/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lslinux/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=15552000" always;

    access_log /var/log/nginx/grafana.lslinux.org.access.log;
    error_log  /var/log/nginx/grafana.lslinux.org.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/live/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
    }
}
