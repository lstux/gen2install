# /etc/nginx/sites-available/saintmarc.bzh
# Certificat : /etc/letsencrypt/live/lslinux/ (SAN couvre saintmarc.bzh et *.saintmarc.bzh)
# Hote canonique : www.saintmarc.bzh (comme sur genserv).

server {
    listen 80;
    listen [::]:80;
    server_name saintmarc.bzh www.saintmarc.bzh;

    location /.well-known/acme-challenge/ {
        root /var/www/saintmarc.bzh;
    }

    location / {
        return 301 https://www.saintmarc.bzh$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name saintmarc.bzh;

    ssl_certificate     /etc/letsencrypt/live/lslinux/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lslinux/privkey.pem;

    return 301 https://www.saintmarc.bzh$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.saintmarc.bzh;

    ssl_certificate     /etc/letsencrypt/live/lslinux/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lslinux/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    root /var/www/saintmarc.bzh;
    index index.html;

    access_log /var/log/nginx/saintmarc.bzh.access.log;
    error_log  /var/log/nginx/saintmarc.bzh.error.log;

    location / {
        try_files $uri $uri/ =404;
    }
}
