# /etc/nginx/sites-available/cloud.lslinux.org (lien dans sites-enabled)
# Certificat : /etc/letsencrypt/live/lslinux/ (SAN *.lslinux.org)

server {
    listen 80;
    listen [::]:80;
    server_name cloud.lslinux.org;

    location /.well-known/acme-challenge/ {
        root /var/www/nextcloud;
    }

    location / {
        return 301 https://cloud.lslinux.org$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cloud.lslinux.org;

    ssl_certificate     /etc/letsencrypt/live/lslinux/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lslinux/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header Referrer-Policy                   "no-referrer"       always;
    add_header X-Content-Type-Options            "nosniff"           always;
    add_header X-Frame-Options                   "SAMEORIGIN"        always;
    add_header X-Permitted-Cross-Domain-Policies "none"              always;
    add_header X-Robots-Tag                      "noindex, nofollow" always;
    fastcgi_hide_header X-Powered-By;

    include mime.types;
    types {
        text/javascript mjs;
    }

    # Derriere le proxy transitoire de genserv : vraies IP clientes (a retirer avec genserv)
    set_real_ip_from 178.32.216.3;
    real_ip_header X-Forwarded-For;

    root /var/www/nextcloud;
    index index.php index.html /index.php$request_uri;

    client_max_body_size 512M;
    client_body_timeout 300s;
    fastcgi_buffers 64 4K;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/cloud.lslinux.org.access.log;
    error_log  /var/log/nginx/cloud.lslinux.org.error.log;

    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    location ^~ /.well-known {
        location = /.well-known/carddav { return 301 /remote.php/dav; }
        location = /.well-known/caldav  { return 301 /remote.php/dav; }
        location /.well-known/acme-challenge    { try_files $uri /dev/null; }
        location /.well-known/pki-validation    { try_files $uri /dev/null; }
        return 301 /index.php$request_uri;
    }

    location ~ ^/(?:build|tests|config|lib|3rdparty|templates|data)(?:$|/) { return 404; }
    location ~ ^/(?:\.|autotest|occ|issue|indie|db_|console)              { return 404; }

    location ~ \.php(?:$|/) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        set $path_info $fastcgi_path_info;
        try_files $fastcgi_script_name =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $path_info;
        fastcgi_param HTTPS on;
        fastcgi_param modHeadersAvailable true;
        fastcgi_param front_controller_active true;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_intercept_errors on;
        fastcgi_request_buffering off;
        fastcgi_read_timeout 3600s;
    }

    location ~ \.(?:css|js|mjs|svg|gif|png|jpg|jpeg|ico|wasm|tflite|map|ogg|flac|woff2?|ttf|bcmap|mp4|webm)$ {
        try_files $uri /index.php$request_uri;
        expires 6M;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php$request_uri;
    }
}
