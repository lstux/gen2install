global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    host: lslng

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ['127.0.0.1:9090']}]
  - job_name: alertmanager
    static_configs: [{targets: ['127.0.0.1:9093']}]
  - job_name: node
    static_configs: [{targets: ['127.0.0.1:9100']}]
  - job_name: mysqld
    static_configs: [{targets: ['127.0.0.1:9104']}]
  - job_name: nginx
    static_configs: [{targets: ['127.0.0.1:9113']}]
  - job_name: bind
    static_configs: [{targets: ['127.0.0.1:9119']}]
  - job_name: postfix
    static_configs: [{targets: ['127.0.0.1:9154']}]
  - job_name: phpfpm
    static_configs: [{targets: ['127.0.0.1:9253']}]
  - job_name: rspamd
    metrics_path: /metrics
    static_configs: [{targets: ['127.0.0.1:11334']}]
  - job_name: mtail
    static_configs: [{targets: ['127.0.0.1:3903']}]
  - job_name: grafana
    static_configs: [{targets: ['127.0.0.1:3000']}]
