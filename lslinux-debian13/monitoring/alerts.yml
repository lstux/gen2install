groups:
  - name: lslng
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.job }} ne repond plus"}
      - alert: DiskSpaceLow
        expr: node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs"} / node_filesystem_size_bytes{fstype=~"ext4|xfs|btrfs"} < 0.15
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.mountpoint }} : moins de 15% libre"}
      - alert: MemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "Memoire disponible < 10%"}
      - alert: MariaDBDown
        expr: mysql_up == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "MariaDB injoignable"}
      - alert: NvmeCriticalWarning
        expr: nvme_critical_warning > 0 or increase(nvme_media_errors_total[1d]) > 0
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "NVMe {{ $labels.device }} : avertissement critique ou erreurs media"}
      - alert: NvmeWearHigh
        expr: nvme_percentage_used_ratio > 0.8 or nvme_available_spare_ratio < 0.2
        for: 1h
        labels: {severity: warning}
        annotations: {summary: "NVMe {{ $labels.device }} : usure elevee ou spare faible"}
      - alert: DmarcParseFailed
        expr: dmarc_parse_ok == 0
        for: 2h
        labels: {severity: warning}
        annotations: {summary: "dmarc-textfile en erreur (voir journal de dmarc-textfile.service)"}
      - alert: DmarcNoReport
        expr: time() - max by (domain) (dmarc_last_report_timestamp_seconds) > 3 * 86400
        for: 1h
        labels: {severity: warning}
        annotations: {summary: "Aucun rapport DMARC pour {{ $labels.domain }} depuis plus de 3 jours"}
      - alert: DmarcFailureRate
        expr: |
          sum by (domain) (dmarc_messages{dmarc="fail"}) / sum by (domain) (dmarc_messages) > 0.05
          and sum by (domain) (dmarc_messages) > 20
        for: 1h
        labels: {severity: warning}
        annotations: {summary: "DMARC : plus de 5% de messages non alignes pour {{ $labels.domain }} (fenetre 7 j)"}
