; /etc/php/8.4/fpm/conf.d/99-nextcloud.ini - coherent avec nginx/cloud.lslinux.org.conf (512M, 3600s)
memory_limit = 512M
upload_max_filesize = 512M
post_max_size = 512M
max_execution_time = 3600
max_input_time = 3600
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.memory_consumption = 128
