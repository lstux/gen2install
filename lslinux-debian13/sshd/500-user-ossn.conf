# /etc/ssh/sshd_config.d/500-user-ossn.conf (lslng) : compte sftp seul de mise a jour du site ossn.info.
# Meme principe que sur genserv : chroot, sftp interne, pas de shell ni de forwarding.
# Le chroot est /var/www/ossn.info (root, non inscriptible) ; le seul dossier modifiable est htdocs/
# (docroot nginx). Les cles sont lues hors du chroot, dans un fichier root que l'utilisateur ne peut pas changer.
Match User ossn
  ChrootDirectory /var/www/ossn.info
  ForceCommand internal-sftp -u 022
  AuthorizedKeysFile /etc/ssh/authorized_keys/%u
  PasswordAuthentication no
  AllowTcpForwarding no
  X11Forwarding no
  PermitTTY no
